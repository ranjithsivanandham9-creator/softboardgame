<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 428" width="400" height="428" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep brown skin -->
    <linearGradient id="leet-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#C68B63"/>
      <stop offset="100%" stopColor="#B67B53"/>
    </linearGradient>
    <!-- Shadow gradient -->
    <linearGradient id="leet-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#111111"/>
      <stop offset="100%" stopColor="#0A0A0A"/>
    </linearGradient>
    <!-- Highlight gradient -->
    <linearGradient id="leet-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#E8E4DC"/>
      <stop offset="100%" stopColor="#D0C8C0"/>
    </linearGradient>
    <!-- Red hoodie -->
    <linearGradient id="hoodie-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#EF4444"/>
      <stop offset="100%" stopColor="#DC2626"/>
    </linearGradient>
    <!-- Dark over-ear headphones -->
    <linearGradient id="headphones-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2D2D2D"/>
      <stop offset="100%" stopColor="#1A1A1A"/>
    </linearGradient>
    <!-- Wine backdrop -->
    <linearGradient id="wine-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4A2530"/>
      <stop offset="100%" stopColor="#2A0E15"/>
    </linearGradient>
  </defs>
  
  <!-- BG - Wine backdrop -->
  <g class="bg">
    <rect x="0" y="0" width="400" height="428" fill="url(#wine-bg)"/>
  </g>
  
  <!-- Body - Red hoodie -->
  <g class="body" fill="url(#hoodie-base)">
    <path d="M150 200 Q100 280 150 360 Q200 440 250 360 Q300 280 250 200 Q200 120 150 120 Z"/>
    <!-- Headphone band -->
    <path d="M180 160 Q170 150 190 150 Q175 140 185 135 Q170 130 180 130 Z" fill="url(#headphones-base)"/>
  </g>
  
  <!-- Neck -->
  <g class="neck">
    <rect x="195" y="360" width="10" height="12" fill="#111111" rx="1"/>
  </g>
  
  <!-- Head -->
  <g class="head">
    <ellipse cx="200" cy="214" rx="160" ry="170" fill="url(#leet-base)"/>
    <!-- Square glasses -->
    <g class="glasses">
      <rect x="155" y="175" width="90" height="40" rx="5" fill="url(#headphones-base)"/>
      <rect x="160" y="180" width="80" height="30" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <!-- Lens highlights -->
      <rect x="165" y="185" width="20" height="15" fill="white" opacity="0.3"/>
      <rect x="235" y="185" width="20" height="15" fill="white" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Ear_L -->
  <g class="ear_L">
    <ellipse cx="130" cy="220" rx="18" ry="22" fill="url(#leet-base)"/>
  </g>
  
  <!-- Ear_R -->
  <g class="ear_R">
    <ellipse cx="270" cy="220" rx="18" ry="22" fill="url(#leet-base)"/>
  </g>
  
  <!-- hair_back -->
  <g class="hair_back" fill="url(#leet-base)">
    <!-- Short black hair -->
    <path d="M100 150 Q80 140 90 130 Q70 120 80 110 Q90 100 70 90 Z"/>
    <path d="M120 160 Q100 150 110 140 Q95 130 105 120 Q90 110 100 100 Z"/>
  </g>
  
  <!-- hair_front -->
  <g class="hair_front" fill="url(#leet-base)">
    <!-- Forehead hair -->
    <path d="M180 120 Q170 100 190 90 Q180 80 200 90 Q190 100 180 110 Q170 120 170 130 Q175 135 170 140"/>
  </g>
  
  <!-- brow_L -->
  <g class="brow_L" fill="#111111">
    <!-- Square glasses brow area -->
    <path d="M130 150 Q120 145 135 140 Q125 150 135 150 Z"/>
  </g>
  
  <!-- brow_R -->
  <g class="brow_R" fill="#111111">
    <!-- Square glasses brow area -->
    <path d="M270 150 Q280 145 275 140 Q265 150 275 150 Z"/>
  </g>
  
  <!-- eye_L -->
  <g class="eye_L" transform-box="fill-box">
    <!-- Sclera -->
    <circle cx="150" cy="200" r="35" fill="#FFF" stroke="none"/>
    <!-- Iris behind glasses -->
    <circle cx="150" cy="200" r="15" fill="#C68B63"/>
    <!-- Pupil -->
    <circle cx="150" cy="200" r="5" fill="#1A1A1A"/>
    <!-- Glass highlight -->
    <rect x="148" y="195" width="8" height "4" fill="white" opacity="0.4"/>
  </g>
  
  <!-- eye_R -->
  <g class="eye_R" transform-box="fill-box">
    <!-- Sclera -->
    <circle cx="250" cy="200" r="35" fill="#FFF" stroke="none"/>
    <!-- Iris behind glasses -->
    <circle cx="250" cy="200" r="15" fill="#C68B63"/>
    <!-- Pupil -->
    <circle cx="250" cy="200" r="5" fill="#1A1A1A"/>
    <!-- Glass highlight -->
    <rect x="248" y="195" width="8" height="4" fill="white" opacity="0.4"/>
  </g>
  
  <!-- nose -->
  <g class="nose">
    <ellipse cx="200" cy="240" rx="10" ry="8" fill="#111111"/>
  </g>
  
  <!-- cheek_L -->
  <g class="cheek_L">
    <circle cx="155" cy="245" r="6" fill="#C68B63" opacity="0.2"/>
  </g>
  
  <!-- cheek_R -->
  <g class="cheek_R">
    <circle cx="245" cy="245" r="6" fill="#C68B63" opacity="0.2"/>
  </g>
  
  <!-- mouth_closed -->
  <g class="mouth_closed">
    <path d="M180 260 Q200 270 220 260" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Subtle smirk -->
    <path d="M185 265 Q200 275 215 265 Q205 270 195 260 Z" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- mouth_open (hidden by default) -->
  <g class="mouth_open" opacity="0">
    <path d="M160 250 Q180 235 200 250 Q190 260 200 270 Q170 280 160 270 Z" fill="#FFF" opacity="0.9"/>
  </g>
  
  <!-- glasses detail -->
  <g class="glasses" opacity="1">
    <rect x="155" y="175" width="90" height="40" rx="5" fill="url(#headphones-base)"/>
    <rect x="160" y="180" width="80" height="30" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="165" y="185" width="20" height="15" fill="white" opacity="0.3"/>
    <rect x="235" y="185" width="20" height="15" fill="white" opacity="0.3"/>
  </g>
  
  <!-- accessory - headphones -->
  <!-- Already included in body -->
  
  <!-- frame_rim -->
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M10 10 Q10 0 50 0 Q90 0 90 10 Q90 50 50 50 Q10 50 10 10 Z"/>
  </g>
</svg>