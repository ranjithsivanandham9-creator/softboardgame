<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark theme -->
    <linearGradient id="incident-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#FACC15"/>
      <stop offset="100%" stopColor "#EAB308"/>
    </linearGradient>
    <linearGradient id="incident-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#FCD34D"/>
      <stop offset="100%" stopColor "#D97706"/>
    </linearGradient>
    <linearGradient id="incident-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#FCD34D"/>
      <stop offset="100%" stopColor "#FACC15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#F87171"/>
      <stop offset="100%" stopColor="#EF4444"/>
    </linearGradient>
    <linearGradient id="rim-light-inc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  
  <g class="bg">
    <rect width="96" height="96" fill="url(#incident-base)"/>
  </g>
  
  <g class="body" fill="url(#incident-base)">
    <!-- Yellow alert triangle -->
    <path d="M8 8 L88 8 L48 92 Z" rx="0" fill="url(#incident-base)"/>
    <!-- Flame icon -->
    <g fill="url(#flame)">
      <path d="M50 16 L50 12 Q50 8 46 8 Q42 8 42 12 Q42 16 46 16 Q50 16 50 16 Z M50 22 L46 28 L54 28 Z M50 30 L46 36 L54 36 Z"/>
    </g>
    <!-- Exclamation mark -->
    <path d="M50 8 L50 4" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g class="neck">
    <line x1="50" y1="88" x2="50" y2="92" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <g class="head">
    <polygon points="48,88 56,84 56,88 48,92" fill="url(#rim-light-inc)"/>
    <text x="52" y="89" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FACC15" font-weight="700">!</text>
  </g>
  
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <g class="eye_L">
    <circle cx="30" cy="48" r="5" fill="#FACC15" opacity="0.8"/>
    <circle cx="30" cy="48" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  <g class="eye_R">
    <circle cx="66" cy="48" r="5" fill="#FACC15" opacity="0.8"/>
    <circle cx="66" cy="48" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <g class="nose">
    <rect x="48" y="54" width="4" height="5" fill="#FACC15"/>
  </g>
  
  <g class="cheek_L">
    <circle cx="38" cy="58" r="3" fill="rgba(255,255,255,0.1)"/>
  </g>
  <g class="cheek_R">
    <circle cx="62" cy="58" r="3" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <g class="mouth_closed">
    <path d="M44 72 Q50 78 56 72"/>
  </g>
  <g class="mouth_open"/>
  
  <g class="glasses"/>
  
  <g class="accessory">
    <g fill="url(#incident-highlight)"/>
  </g>
  
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
</svg>