<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark theme -->
    <linearGradient id="floor-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#1F1F23"/>
      <stop offset="100%" stopColor "#18181B"/>
    </linearGradient>
    <linearGradient id="floor-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#4A4A5A"/>
      <stop offset="100%" stopColor "#27272A"/>
    </linearGradient>
    <linearGradient id="floor-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#27272A"/>
      <stop offset="100%" stopColor "#18181B"/>
    </linearGradient>
    <linearGradient id="desk-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#F9FAFB"/>
      <stop offset="100%" stopColor "#F4F4F5"/>
    </linearGradient>
    <linearGradient id="chair-seat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#D1D5DB"/>
      <stop offset="100%" stopColor "#9CA3AF"/>
    </linearGradient>
    <linearGradient id="rim-light-floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  
  <g class="bg">
    <rect width="96" height="96" fill="url(#floor-base)"/>
  </g>
  
  <g class="body" fill="url(#floor-base)">
    <!-- Open floor plan - desk and chair -->
    <!-- Desk surface -->
    <rect x="16" y="20" width "64" height "32" rx "4" fill="url(#desk-surface)"/>
    <!-- Desk legs -->
    <g fill="rgba(255,255,255,0.2)">
      <rect x="24" y="52" width "8" height "8" rx "2"/>
      <rect x "48" y="52" width "8" height "8" rx "2"/>
    </g>
    <!-- Chair -->
    <g fill="url(#chair-seat)">
      <rect x="72" y="40" width "16" height "12" rx "2"/>
      <rect x "76" y "52" width "8" height "8" rx "2"/>
      <path d="M72 40 L72 52 M76 52 L84 52 M72 40 L84 40" stroke="rgba(255,255,255,0.3)" stroke-width "1"/>
    </g>
  </g>
  
  <g class="neck">
    <line x1="50" y1="88" x2="50" y2="92" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <g class="head">
    <polygon points="48,88 56,84 56,88 48,92" fill="url(#rim-light-floor)"/>
    <text x="52" y="89" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FFFFFF" font-weight="700">♦</text>
  </g>
  
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <g class="eye_L">
    <circle cx="30" cy="48" r="4" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <g class="eye_R">
    <circle cx="66" cy="48" r="4" fill="#FFFFFF" opacity="0.5"/>
  </g>
  
  <g class="nose">
    <rect x="48" y="54" width "4" height "4" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <g class="cheek_L">
    <circle cx="38" cy="58" r="2" fill="rgba(255,255,255,0.1)"/>
  </g>
  <g class="cheek_R">
    <circle cx="62" cy="58" r="2" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <g class="mouth_closed">
    <path d="M44 72 Q50 78 56 72"/>
  </g>
  <g class="mouth_open"/>
  
  <g class="glasses"/>
  
  <g class="accessory">
    <g fill="url(#desk-surface)"/>
  </g>
  
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
</svg>