<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Three-tone gradients for dark theme -->
    <linearGradient id="start-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FAFAFA"/>
      <stop offset="100%" stopColor="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="start-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#D1D5DB"/>
      <stop offset="100%" stopColor="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="start-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F9FAFB"/>
      <stop offset="100%" stopColor="#F3F4F6"/>
    </linearGradient>
    <!-- Top-left rim light -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop="transparent"/>
    </linearGradient>
    <!-- Launch pad -->
    <linearGradient id="launch-pad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- BG - Base shape -->
  <g class="bg">
    <path d="M0 0 L96 0 L96 96 L0 96 Z" fill="url(#start-base)"/>
  </g>
  
  <!-- Body - Launch pad flag -->
  <g class="body" fill="url(#launch-pad)">
    <path d="M8 8 L88 8 L88 88 L8 88 Z" rx="8"/>
    <!-- Pole -->
    <rect x="43" y="8" width="10" height="80" rx="2" fill="#EF4444"/>
    <!-- Flag fold -->
    <path d="M88 30 L96 30 L96 88 L88 88 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Neck - flagpole connector -->
  <g class="neck">
    <line x1="53" y1="88" x2="53" y2="92" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>
  
  <!-- Head - flag top -->
  <g class="head">
    <polygon points="50,92 56,88 56,92 50,96" fill="url(#rim-light)"/>
  </g>
  
  <!-- Ear_L - not applicable for icon -->
  <g class="ear_L"/>
  <g class="ear_R"/>
  
  <!-- hair_back -->
  <g class="hair_back"/>
  <g class="hair_front"/>
  
  <!-- brow_L -->
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <!-- eye_L -->
  <g class="eye_L">
    <circle cx="30" cy="48" r="8" fill="#EF4444"/>
    <circle cx="30" cy="48" r="3" fill="rgba(255,255,255,0.8)"/>
  </g>
  <!-- eye_R -->
  <g class="eye_R">
    <circle cx="66" cy="48" r="8" fill="#EF4444"/>
    <circle cx="66" cy="48" r="3" fill="rgba(255,255,255,0.8)"/>
  </g>
  
  <!-- nose -->
  <g class="nose">
    <circle cx="50" cy="58" r="3" fill="#EF4444"/>
  </g>
  
  <!-- cheek_L -->
  <g class="cheek_L">
    <circle cx="38" cy="58" r="4" fill="rgba(255,255,255,0.3)"/>
  </g>
  <!-- cheek_R -->
  <g class="cheek_R">
    <circle cx="62" cy="58" r="4" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- mouth_closed -->
  <g class="mouth_closed">
    <path d="M44 72 Q50 78 56 72"/>
  </g>
  
  <!-- mouth_open -->
  <g class="mouth_open"/>
  
  <!-- glasses -->
  <g class="glasses"/>
  
  <!-- accessory -->
  <g class="accessory"/>
  
  <!-- frame_rim - rounded sticker frame -->
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
</svg>