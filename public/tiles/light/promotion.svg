    <circle cx="30" cy="48" r="2" fill="rgba(0,0,0,0.4)"/>
  </g>
  <g class="eye_R">
    <circle cx="66" cy="48" r="5" fill="#22C55E" opacity="0.9"/>
    <circle cx="66" cy="48" r="2" fill="rgba(0,0,0,0.4)"/>
  </g>
  
  <g class="nose">
    <rect x="48" y="54" width="4" height="5" fill="rgba(0,0,0,0.2)"/>
  </g>
  
  <g class="cheek_L"/>
  <g class="cheek_R"/>
  
