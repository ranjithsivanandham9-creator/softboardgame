<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="promo-base-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#FFFFFF"/>
      <stop offset="100%" stopColor "#F4F4F5"/>
    </linearGradient>
    <linearGradient id="promo-shadow-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#E5E7EB"/>
      <stop offset="100%" stopColor "#D1D5DB"/>
    </linearGradient>
    <linearGradient id="promo-highlight-light" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#D1D5DB"/>
      <stop offset="100%" stopColor "#E5E7EB"/>
    </linearGradient>
    <linearGradient id="green-pipe-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#22C55E"/>
      <stop offset="100%" stopColor "#16A34A"/>
    </linearGradient>
    <linearGradient id="rim-light-promo-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop="transparent"/>
    </linearGradient>
  </defs>
  
  <g class="bg">
    <rect width="96" height="96" fill="url(#promo-base-light)"/>
  </g>
  
  <g class="body" fill="url(#promo-base-light)">
    <rect x="8" y="8" width="80" height="72" rx="6" fill="url(#promo-base-light)"/>
    <g fill="url(#green-pipe-light)">
      <path d="M24 32 Q24 24 32 24 Q36 24 36 32 Q36 40 28 40 Q20 40 20 32 Q20 24 28 24 Q32 24 32 32 Z"/>
      <polygon points="36,24 40,16 44,24" fill="url(#green-pipe-light)"/>
    </g>
    <g fill="rgba(0,0,0,0.1)">
      <circle cx="20" cy="24" r="3"/>
      <circle cx="36" cy="24" r="3"/>
      <circle cx="52" cy="24" r="3"/>
      <circle cx="68" cy="24" r="3"/>
    </g>
  </g>
  
  <g class="neck">
    <line x1="50" y1="80" x2="50" y2="84" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>
  
  <g class="head">
    <polygon points="48,84 56,80 56,84 48,88" fill="url(#rim-light-promo-light)"/>
    <text x="52" y="86" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FFFFFF" font-weight="700">▲</text>
  </g>
  
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <g class="eye_L">
