  </g>
  
  <g class="frame_rim" stroke="rgba(0,0,0,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
