<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="floor-base-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#FFFFFF"/>
      <stop offset="100%" stopColor "#F4F4F5"/>
    </linearGradient>
    <linearGradient id="floor-shadow-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#E5E7EB"/>
      <stop offset="100%" stopColor "#D1D5DB"/>
    </linearGradient>
    <linearGradient id="floor-highlight-light" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#D1D5DB"/>
      <stop offset="100%" stopColor "#E5E7EB"/>
    </linearGradient>
    <linearGradient id="desk-surface-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#F9FAFB"/>
      <stop offset="100%" stopColor "#F4F4F5"/>
    </linearGradient>
    <linearGradient id="chair-seat-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#D1D5DB"/>
      <stop offset="100%" stopColor "#9CA3AF"/>
    </linearGradient>
    <linearGradient id="rim-light-floor-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop="rgba(0,0,0,0.05)"/>
    </linearGradient>
  </defs>
  
  <g class="bg">
    <rect width="96" height="96" fill="url(#floor-base-light)"/>
  </g>
  
  <g class="body" fill="url(#floor-base-light)">
    <rect x="16" y="20" width "64" height "32" rx "4" fill="url(#desk-surface-light)"/>
    <g fill="rgba(0,0,0,0.1)">
      <rect x="24" y="52" width "8" height "8" rx "2"/>
      <rect x="48" y="52" width "8" height "8" rx "2"/>
    </g>
    <g fill="url(#chair-seat-light)">
      <rect x="72" y="40" width "16" height "12" rx "2"/>
      <rect x="76" y="52" width "8" height "8" rx "2"/>
      <path d="M72 40 L72 52 M76 52 L84 52 M72 40 L84 40" stroke="rgba(0,0,0,0.3)" stroke-width "1"/>
    </g>
  </g>
  
  <g class="neck">
    <line x1="50" y1="92" x2="50" y2="96" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>
  
  <g class="head">
    <polygon points="48,92 56,88 56,92 48,96" fill="url(#rim-light-floor-light)"/>
    <text x="52" y="89" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FFFFFF" font-weight="700">♦</text>
  </g>
  
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
