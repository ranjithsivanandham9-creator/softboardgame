<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark theme gradients -->
    <linearGradient id="repo-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1F1F23"/>
      <stop offset="100%" stopColor="#18181B"/>
    </linearGradient>
    <linearGradient id="repo-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4A4A5A"/>
      <stop offset="100%" stopColor="#27272A"/>
    </linearGradient>
    <linearGradient id="repo-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#27272A"/>
      <stop offset="100%" stopColor="#18181B"/>
    </linearGradient>
    <linearGradient id="led-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8B5CF6"/>
      <stop offset="100%" stopColor="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rim-light-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <!-- Server rack -->
    <linearGradient id="rack-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#3F3F46"/>
      <stop offset="100%" stopColor="#27272A"/>
    </linearGradient>
    <!-- Upgrade badge -->
    <linearGradient id="badge-up" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#22C55E"/>
      <stop offset="100%" stopColor="#16A34A"/>
    </linearGradient>
  </defs>
  
  <!-- BG -->
  <g class="bg">
    <rect width="96" height="96" fill="url(#repo-base)"/>
  </g>
  
  <!-- Body - Server rack with glowing LEDs -->
  <g class="body" fill="url(#rack-base)">
    <!-- Main rack structure -->
    <rect x="8" y="8" width="80" height="72" rx="6" fill="url(#rack-base)"/>
    <!-- LED rows -->
    <g fill="url(#led-glow)">
      <rect x="16" y="16" width "8" height="8" rx="2"/>
      <rect x="16" y="32" width="8" height="8" rx="2"/>
      <rect x="16" y="48" width="8" height="8" rx="2"/>
      <rect x="32" y="16" width="8" height="8" rx="2"/>
      <rect x="32" y="32" width="8" height="8" rx="2"/>
      <rect x="32" y="48" width="8" height="8" rx="2"/>
      <rect x="48" y="16" width="8" height="8" rx="2"/>
      <rect x="48" y="32" width="8" height="8" rx="2"/>
      <rect x="48" y="48" width="8" height="8" rx="2"/>
      <rect x="64" y="16" width="8" height="8" rx="2"/>
      <rect x="64" y="32" width="8" height="8" rx="2"/>
      <rect x="64" y="48" width="8" height="8" rx="2"/>
    </g>
    <!-- Ventilation slots -->
    <g fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1">
      <line x1="16" y1="16" x2="16" y2="64"/>
      <line x1="32" y1="16" x2="32" y2="64"/>
      <line x1="48" y1="16" x2="48" y2="64"/>
      <line x1="64" y1="16" x2="64" y2="64"/>
      <line x1="16" y1="32" x2="64" y2="32"/>
      <line x1="16" y1="48" x2="64" y2="48"/>
    </g>
  </g>
  
  <!-- Neck -->
  <g class="neck">
    <line x1="50" y1="80" x2="50" y2="84" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Head - corner office indicator -->
  <g class="head">
    <polygon points="48,84 56,80 56,84 48,88" fill="url(#rim-light)"/>
    <text x="52" y="86" text-anchor="middle" font-family="Geist Mono, monospace" font-size="6" fill="#FFFFFF" font-weight="700">CO</text>
  </g>
  
  <!-- ear_L, ear_R, hair -->
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <!-- eye_L - shows owner color -->
  <g class="eye_L">
    <circle cx="30" cy="48" r="6" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="30" cy="48" r="2" fill="rgba(255,255,255,0.5)"/>
  </g>
  <!-- eye_R -->
  <g class="eye_R">
    <circle cx="66" cy="48" r="6" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="66" cy="48" r="2" fill="rgba(255,255,255,0.5)"/>
  </g>
  
  <!-- nose -->
  <g class="nose">
    <rect x="48" y="54" width="4" height="6" fill="rgba(255,255,255,0.2)"/>
  </g>
  
  <!-- cheek_L, cheek_R -->
  <g class="cheek_L"/>
  <g class="cheek_R"/>
  
  <!-- mouth_closed -->
  <g class="mouth_closed"/>
  <!-- mouth_open -->
  <g class="mouth_open"/>
  
  <!-- glasses -->
  <g class="glasses"/>
  
  <!-- accessory - upgrade badges 1-2 -->
  <g class="accessory">
    <g fill="url(#badge-up)">
      <rect x="16" y="74" width="16" height="8" rx="2"/>
      <rect x="40" y="74" width="16" height="8" rx="2"/>
    </g>
    <text x="24" y="79" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FFFFFF" font-weight="700">1</text>
    <text x="48" y="79" text-anchor="middle" font-family="Geist Mono, monospace" font-size="5" fill="#FFFFFF" font-weight="700">2</text>
  </g>
  
  <!-- frame_rim -->
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
</svg>