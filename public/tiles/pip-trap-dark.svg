<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark theme -->
    <linearGradient id="trap-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#EF4444"/>
      <stop offset="100%" stopColor "#DC2626"/>
    </linearGradient>
    <linearGradient id="trap-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FCA5A5"/>
      <stop offset="100%" stopColor="#F87171"/>
    </linearGradient>
    <linearGradient id="trap-highlight" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stopColor "#F87171"/>
      <stop offset="100%" stopColor "#EF4444"/>
    </linearGradient>
    <linearGradient id="diagonal-stripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.3)"/>
      <stop offset="20%" stop="transparent"/>
      <stop offset="40%" stop="rgba(255,255,255,0.3)"/>
      <stop offset="60%" stop="transparent"/>
      <stop offset="80%" stop="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <linearGradient id="rim-light-trap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  
  <g class="bg">
    <rect width="96" height="96" fill="url(#trap-base)"/>
  </g>
  
  <g class="body" fill="url(#trap-base)">
    <!-- PIP Trap hazard sign -->
    <path d="M8 8 L88 8 L88 88 L8 88 Z" rx="8" fill="url(#trap-base)"/>
    <!-- Diagonal hazard stripes -->
    <path d="M8 8 L88 88 M88 8 L8 88" stroke="url(#diagonal-stroke)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Central warning -->
    <g fill="rgba(255,255,255,0.2)">
      <circle cx="50" cy="50" r="12"/>
      <path d="M44 50 Q50 44 56 50" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <g class="neck">
    <line x1="50" y1="88" x2="50" y2="92" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <g class="head">
    <polygon points="48,88 56,84 56,88 48,92" fill="url(#rim-light-trap)"/>
    <text x="52" y="89" text-anchor="middle" font-family="Geist Mono, monospace" font-size="6" fill="#EF4444" font-weight="700">▼</text>
  </g>
  
  <g class="ear_L"/>
  <g class="ear_R"/>
  <g class="hair_back"/>
  <g class="hair_front"/>
  <g class="brow_L"/>
  <g class="brow_R"/>
  
  <g class="eye_L">
    <circle cx="30" cy="48" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="30" cy="48" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  <g class="eye_R">
    <circle cx="66" cy="48" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="66" cy="48" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <g class="nose">
    <rect x="48" y="54" width="4" height="5" fill="#EF4444"/>
  </g>
  
  <g class="cheek_L">
    <circle cx="38" cy="58" r="3" fill="rgba(255,255,255,0.1)"/>
  </g>
  <g class="cheek_R">
    <circle cx="62" cy="58" r="3" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <g class="mouth_closed">
    <path d="M44 72 Q50 78 56 72"/>
  </g>
  <g class="mouth_open"/>
  
  <g class="glasses"/>
  
  <g class="accessory">
    <g fill="url(#diagonal-stripe)"/>
  </g>
  
  <g class="frame_rim" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
    <path d="M2 2 Q2 2 20 2 Q20 2 20 20 Q20 94 2 94 Q2 94 2 86 Z"/>
  </g>
</svg>